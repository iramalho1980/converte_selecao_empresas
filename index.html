<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Converte | Seleção empresas - Conversão Convensional</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--skin:linear-gradient(115deg,#2c3e50,#2980b9);--accent:#f6e58d;--glass:rgba(255,255,255,.105);--line:rgba(255,255,255,.16);--text:#f6f8fc;--muted:#bac7d6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--skin);background-attachment:fixed;color:var(--text);font:300 13px Ubuntu,Arial,sans-serif;padding:28px 22px 92px}body:before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 10%,rgba(255,255,255,.12),transparent 34%),radial-gradient(ellipse at 88% 82%,rgba(244,220,130,.13),transparent 30%);pointer-events:none}.wrap{max-width:1420px;margin:auto;position:relative}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.mark{width:38px;height:38px;border-radius:13px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;box-shadow:0 0 24px #ffffff18}.brand h1{font-size:19px;font-weight:400;margin:0;color:var(--accent);text-shadow:0 0 12px #f6e58d70}.brand p{margin:4px 0 0;color:var(--muted);font-size:11px}.actions{display:flex;gap:8px}.btn,.iconbtn,select,input{font:inherit;color:var(--text)}.btn,.iconbtn{border:1px solid var(--line);background:var(--glass);border-radius:10px;padding:9px 12px;cursor:pointer;backdrop-filter:blur(16px);transition:.2s}.btn:hover,.iconbtn:hover{background:#ffffff24;box-shadow:0 0 18px #dce8ff23;transform:translateY(-1px)}.btn.primary{background:#f6e58d;color:#263243;border:0;font-weight:500}.card{background:var(--glass);border:1px solid var(--line);border-radius:17px;backdrop-filter:blur(20px);box-shadow:0 18px 55px #101b2c20;padding:17px;margin-bottom:15px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.toolbar h2{font-size:14px;font-weight:400;margin:0 auto 0 0}.toolbar select,.toolbar input,.mapgrid select,.search{background:#13263c40;border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}.toolbar select option,.mapgrid select option{color:#152331}.toolbar input{min-width:180px}.hint{color:var(--muted);font-size:11px}.tablebox{overflow:auto;max-height:calc(100vh - 310px);min-height:170px;margin-top:14px;border:1px solid #ffffff12;border-radius:12px}table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}th{position:sticky;top:0;background:#172a40eF;color:#f5e69a;font-weight:400;text-align:left;white-space:nowrap;z-index:2}td,th{padding:9px 10px;border-bottom:1px solid #ffffff12;white-space:nowrap;min-width:max-content}td{color:#f2f5fa}tbody tr:hover{background:#ffffff0a}td[contenteditable=true]{outline:none;cursor:text}td[contenteditable=true]:focus{background:#ffffff17;box-shadow:inset 0 0 0 1px #f6e58d90}.rowcheck{accent-color:#f6e58d}.del{border:0;background:transparent;cursor:pointer;font-size:14px;opacity:.8}.empty{text-align:center;color:var(--muted);padding:45px 10px}.bottom{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.pages{display:flex;gap:6px;align-items:center}.modal{position:fixed;inset:0;z-index:10;background:#07111dcc;backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}.dialog{width:min(960px,100%);max-height:90vh;overflow:auto;background:linear-gradient(145deg,#263a52f2,#14263df2);border:1px solid #ffffff25;border-radius:20px;padding:24px;box-shadow:0 25px 90px #0008}.dialog h2{font-weight:400;color:var(--accent);margin:0 0 7px}.dialog p{color:var(--muted);line-height:1.55}.drop{border:1px dashed #ffffff45;border-radius:14px;text-align:center;padding:23px;margin:18px 0;background:#ffffff08}.drop input{max-width:100%;color:var(--text);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:7px;backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 20px rgba(8,18,35,.18)}.drop input::file-selector-button{font:inherit;font-weight:400;color:#f6f8fc;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.28);border-radius:9px;padding:8px 13px;margin-right:11px;cursor:pointer;backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 14px rgba(4,14,29,.2);transition:background .2s,box-shadow .2s,transform .2s}.drop input::file-selector-button:hover{background:rgba(255,255,255,.25);box-shadow:0 0 16px rgba(220,232,255,.2);transform:translateY(-1px)}.drop input::-webkit-file-upload-button{font:inherit;font-weight:400;color:#f6f8fc;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.28);border-radius:9px;padding:8px 13px;margin-right:11px;cursor:pointer;backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 14px rgba(4,14,29,.2)}.mapgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}.mapitem{padding:11px;border:1px solid #ffffff18;border-radius:10px}.mapitem label{display:block;margin-bottom:7px;color:#f6e58d}.mapitem select{width:100%}.spinwrap{display:none;position:fixed;inset:0;z-index:15;background:#07111dcc;backdrop-filter:blur(8px);place-items:center}.spinbox{text-align:center}.spinner{width:76px;height:76px;border-radius:50%;border:6px solid transparent;border-top-color:#f6e58d;border-right-color:#ffffffbb;border-bottom-color:#ffffff55;border-left-color:#ffffffaa;filter:drop-shadow(0 0 13px #fff9);animation:rot .8s linear infinite;margin:0 auto 16px}@keyframes rot{to{transform:rotate(360deg)}}.progress{width:220px;height:5px;border-radius:5px;background:#ffffff26;overflow:hidden;margin:12px auto}.progress i{display:block;height:100%;width:0;background:#f6e58d;transition:width .12s}.footer{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:9px;padding:8px 11px;background:#13263caa;border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(18px);box-shadow:0 8px 30px #0003}.footer button{width:38px;height:36px;font-size:17px}.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-15px);opacity:0;transition:.25s;background:#182b40;border:1px solid var(--line);padding:11px 17px;border-radius:11px;z-index:30;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.skinwrap{position:relative}.skinmenu{display:none;position:absolute;right:0;top:44px;background:#14263df2;border:1px solid var(--line);border-radius:12px;padding:7px;z-index:6;width:180px}.skinmenu button{display:block;width:100%;height:30px;border:0;border-radius:7px;margin:5px 0;cursor:pointer}.skinmenu .s1{background:linear-gradient(to right,#2c3e50,#2980b9)}.skinmenu .s2{background:linear-gradient(to right,#3B4371,#F3904F)}.skinmenu .s3{background:linear-gradient(to right,#19547b,#ffd89b)}.skinmenu .s4{background:linear-gradient(to right,#000,#152331)}@media(max-width:850px){.mapgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){body{padding:17px 12px 85px}.top{align-items:flex-start;gap:12px}.actions{flex-wrap:wrap;justify-content:flex-end}.mapgrid{grid-template-columns:1fr}.toolbar h2{width:100%}.tablebox{max-height:60vh}.bottom{gap:10px;flex-wrap:wrap}}
</style></head>
<body><main class="wrap"><header class="top"><div class="brand"><div class="mark">▦</div><div><h1>Conversor | Seleção de Empresas</h1><p>Importe, organize e exporte seus dados</p></div></div><div class="actions"><button class="btn" onclick="openImport()">＋ Planilha</button><div class="skinwrap"><button class="iconbtn" title="Selecionar tema" onclick="toggleSkins()">◉</button><div class="skinmenu" id="skinmenu"><button class="s1" onclick="setSkin(0)" title="Azul profundo"></button><button class="s2" onclick="setSkin(1)" title="Ametista e âmbar"></button><button class="s3" onclick="setSkin(2)" title="Oceano dourado"></button><button class="s4" onclick="setSkin(3)" title="Noturno"></button></div></div></div></header>
<section class="card"><div class="toolbar"><h2>Dados <span id="count" class="hint">—</span></h2><select id="bulkCol" aria-label="Coluna para alteração em lote"></select><select id="bulkScope"><option value="all">Todas</option><option value="empty">Vazias</option><option value="selected">Selecionadas</option></select><input id="bulkValue" placeholder="Valor desejado"><button class="btn primary" onclick="applyBulk()" title="Aplicar alteração">✓ Aplicar</button><input class="search" id="search" placeholder="⌕ Buscar..." oninput="render()"></div><div class="tablebox" id="tablebox"><div class="empty">Importe uma planilha para começar.</div></div><div class="bottom"><span class="hint" id="range">Nenhum dado carregado</span><div class="pages"><button class="iconbtn" onclick="go(0)" title="Início">|◀</button><button class="iconbtn" onclick="go(page-1)" title="Anterior">◀</button><span class="hint" id="pg">0 / 0</span><button class="iconbtn" onclick="go(page+1)" title="Próxima">▶</button><button class="iconbtn" onclick="go(Math.ceil(rows.length/10)-1)" title="Final">▶|</button></div></div></section></main>
<div class="footer"><button class="iconbtn" title="Salvar XML" onclick="exportXML()">⇩</button><button class="iconbtn" title="Importar XML" onclick="document.getElementById('xmlfile').click()">⇧</button><button class="iconbtn" title="Exportar TXT para Domínio" onclick="exportTXT()">▤</button><button class="iconbtn" title="Salvar no navegador" onclick="saveLocal()">▣</button><input type="file" id="xmlfile" accept=".xml" hidden onchange="importXML(this.files[0])"></div>
<div class="modal" id="importModal"><div class="dialog"><h2>Importar planilha</h2><p>Selecione um arquivo Excel ou CSV para carregar os dados.</p><div class="drop"><input type="file" id="file" accept=".xlsx,.xls,.csv" onchange="readFile(this.files[0])"><div class="hint" style="margin-top:8px">Formatos aceitos: XLSX, XLS e CSV</div></div><div id="sheetWrap" style="display:none"><select id="sheetSelect" hidden></select><div id="mapArea"></div><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" onclick="closeImport()">Cancelar</button><button class="btn primary" onclick="confirmImport()">✓ Carregar dados</button></div></div><div style="text-align:right;margin-top:14px"><button class="btn" id="closeBtn" onclick="closeImport()">Fechar</button></div></div></div>
<div class="spinwrap" id="spin"><div class="spinbox"><div class="spinner"></div><div id="spintext">Preparando planilha…</div><div class="progress"><i id="bar"></i></div><span id="pct">0%</span></div></div><div class="toast" id="toast"></div>
<script>
const fields=['Código da empresa','Nome da empresa','CNPJ','Regime','Contabilização (cli/for)','Matriz/filial','Perfil'];let rows=[],page=0,headers=[],sourceRows=[],workbook=null,chosenData=[];const aliases=[['código','codigo','código da empresa','codigo da empresa'],['nome','nome da empresa','empresa'],['cnpj','inscrição','inscricao','cgc'],['regime'],['contas contábeis clientes / fornecedores','contas contabeis clientes / fornecedores','contabilização','contabilizacao','cli/for','clientes / fornecedores'],['matriz / filial','matriz/filial'],['perfil']];
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ')}function autoMap(h){return aliases.map(a=>{const i=h.findIndex(x=>a.some(y=>norm(x)===norm(y)||norm(x).includes(norm(y))));return i<0?'':String(i)})}function openImport(){document.getElementById('importModal').style.display='grid'}function closeImport(){document.getElementById('importModal').style.display='none'}
function readFile(file){if(!file)return;if(!window.XLSX){toast('Biblioteca de leitura indisponível. Verifique a conexão.');return}const spin=document.getElementById('spin');spin.style.display='grid';document.getElementById('spintext').textContent='Lendo a planilha…';document.getElementById('bar').style.width='0%';document.getElementById('pct').textContent='0%';const reader=new FileReader();reader.onprogress=e=>{if(e.lengthComputable){const p=Math.min(85,Math.round(e.loaded/e.total*85));document.getElementById('bar').style.width=p+'%';document.getElementById('pct').textContent=p+'%'}};reader.onload=e=>{setTimeout(()=>{try{workbook=XLSX.read(e.target.result,{type:'array',cellDates:false});const sel=document.getElementById('sheetSelect');sel.innerHTML=workbook.SheetNames.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join('');document.getElementById('bar').style.width='100%';document.getElementById('pct').textContent='100%';chooseSheet();setTimeout(()=>{spin.style.display='none';document.getElementById('sheetWrap').style.display='block';document.querySelector('.dialog > p').style.display='none';document.querySelector('.dialog .drop').style.display='none';document.getElementById('closeBtn').style.display='none'},220)}catch(err){spin.style.display='none';toast('Não foi possível ler o arquivo.')}} ,30)};reader.onerror=()=>{spin.style.display='none';toast('Falha ao abrir o arquivo.')};reader.readAsArrayBuffer(file)}
function chooseSheet(){const sh=workbook.Sheets[workbook.SheetNames[+document.getElementById('sheetSelect').value]];const a=XLSX.utils.sheet_to_json(sh,{header:1,defval:'',raw:false});sourceRows=a.filter(r=>r.some(v=>String(v).trim()!==''));headers=(sourceRows[0]||[]).map((x,i)=>String(x||`Coluna ${i+1}`));const map=autoMap(headers);const standard=map.filter(x=>x!=='').length===7;document.getElementById('mapArea').innerHTML=`<p>${standard?'✓ Planilha padrão detectada. O mapeamento dos campos será automático.':'Esta planilha tem estrutura diferente. Selecione manualmente as colunas correspondentes.'}</p><div class="mapgrid">${fields.map((f,i)=>`<div class="mapitem"><label>${f}</label><select data-field="${i}"><option value="">— Não importar —</option>${headers.map((h,j)=>`<option value="${j}" ${map[i]===String(j)?'selected':''}>${esc(h)}</option>`).join('')}</select></div>`).join('')}</div>`;}
function confirmImport(){const selects=[...document.querySelectorAll('[data-field]')];if(selects.some(s=>s.value==='')){toast('Mapeie todos os campos antes de continuar.');return}const ix=selects.map(s=>+s.value);const data=sourceRows.slice(1);const standard=autoMap(headers).every(x=>x!=='');if(standard)toast('Planilha padrão: mapeamento automático aplicado.');document.getElementById('importModal').style.display='none';loading(data,ix)}
function loading(data,ix){const spin=document.getElementById('spin');spin.style.display='grid';let i=0;rows=[];page=0;const batch=Math.max(1,Math.ceil(data.length/40));function step(){const end=Math.min(i+batch,data.length);for(;i<end;i++){const r=data[i];const o={};fields.forEach((f,j)=>o[f]=String(r[ix[j]]??''));if(Object.values(o).some(v=>v.trim()!==''))rows.push(o)}const p=data.length?Math.floor(i/data.length*100):100;document.getElementById('bar').style.width=p+'%';document.getElementById('pct').textContent=p+'%';if(i<data.length)setTimeout(step,18);else{setTimeout(()=>{spin.style.display='none';setupBulk();render();toast(`${rows.length} registros importados.`)},180)}}step()}
function setupBulk(){document.getElementById('bulkCol').innerHTML=fields.map(f=>`<option>${esc(f)}</option>`).join('')}
function render(){const q=norm(document.getElementById('search').value);const filtered=rows.map((r,i)=>({r,i})).filter(x=>!q||fields.some(f=>norm(x.r[f]).includes(q)));const pages=Math.max(1,Math.ceil(filtered.length/10));page=Math.max(0,Math.min(page,pages-1));const part=filtered.slice(page*10,page*10+10);document.getElementById('count').textContent=`(${rows.length})`;document.getElementById('pg').textContent=`${filtered.length?page+1:0} / ${filtered.length?pages:0}`;document.getElementById('range').textContent=filtered.length?`Exibindo ${page*10+1}–${Math.min((page+1)*10,filtered.length)} de ${filtered.length}`:'Nenhum registro';if(!rows.length){document.getElementById('tablebox').innerHTML='<div class="empty">Importe uma planilha para começar.</div>';return}let html='<table><thead><tr><th><input type="checkbox" class="rowcheck" onchange="selectPage(this)"></th>'+fields.map(f=>`<th>${esc(f)}</th>`).join('')+'<th></th></tr></thead><tbody>';html+=part.map(({r,i})=>`<tr data-index="${i}"><td><input type="checkbox" class="rowcheck rowselect" value="${i}"></td>${fields.map(f=>`<td contenteditable="true" data-col="${esc(f)}" onblur="editCell(this)">${esc(r[f])}</td>`).join('')}<td><button class="del" title="Excluir" onclick="delRow(${i})">❌</button></td></tr>`).join('');html+='</tbody></table>';document.getElementById('tablebox').innerHTML=html}
function editCell(el){const tr=el.closest('tr');rows[+tr.dataset.index][el.dataset.col]=el.innerText.trim()}function delRow(i){rows.splice(i,1);render()}function selectPage(box){document.querySelectorAll('.rowselect').forEach(c=>c.checked=box.checked)}function go(p){page=Math.max(0,p);render()}function applyBulk(){const col=document.getElementById('bulkCol').value,val=document.getElementById('bulkValue').value,scope=document.getElementById('bulkScope').value;let targets=rows.map((r,i)=>i);if(scope==='empty')targets=targets.filter(i=>!rows[i][col].trim());if(scope==='selected')targets=[...document.querySelectorAll('.rowselect:checked')].map(c=>+c.value);targets.forEach(i=>rows[i][col]=val);render();toast(`${targets.length} registros alterados.`)}
function exportTXT(){const groups=new Map();rows.forEach(r=>{const regime=r['Regime'].trim(),code=r['Código da empresa'].trim();if(!regime||!code)return;if(!groups.has(regime))groups.set(regime,[]);groups.get(regime).push(code)});const lines=[...groups].map(([reg,codes])=>`${reg};${codes.join(',')}`);download(new Blob([lines.join('\r\n')],{type:'text/plain;charset=utf-8'}),'seleção_empresas.txt');toast('Arquivo TXT exportado.')}function exportXML(){const escxml=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');let xml='<?xml version="1.0" encoding="UTF-8"?>\n<empresas>\n'+rows.map(r=>'  <empresa>'+fields.map(f=>`<${tag(f)}>${escxml(r[f])}</${tag(f)}>`).join('')+'</empresa>').join('\n')+'\n</empresas>';download(new Blob([xml],{type:'application/xml;charset=utf-8'}),'empresas.xml')}function tag(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')}
function importXML(file){if(!file)return;const fr=new FileReader();fr.onload=()=>{try{const doc=new DOMParser().parseFromString(fr.result,'application/xml');const es=[...doc.querySelectorAll('empresa')];rows=es.map(e=>Object.fromEntries(fields.map(f=>[f,e.querySelector(tag(f))?.textContent||''])));page=0;render();toast(`${rows.length} registros recuperados.`)}catch(e){toast('XML inválido.')} };fr.readAsText(file)}function saveLocal(){localStorage.setItem('gestorEmpresas',JSON.stringify(rows));toast('Dados salvos neste navegador.')}function loadLocal(){try{rows=JSON.parse(localStorage.getItem('gestorEmpresas')||'[]');render()}catch(e){}}function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
const skins=['linear-gradient(to right,#2c3e50,#2980b9)','linear-gradient(to right,#3B4371,#F3904F)','linear-gradient(to right,#19547b,#ffd89b)','linear-gradient(to right,#000000,#152331)'];function setSkin(i){document.documentElement.style.setProperty('--skin',skins[i]);document.getElementById('skinmenu').style.display='none';localStorage.setItem('gestorSkin',i)}function toggleSkins(){const e=document.getElementById('skinmenu');e.style.display=e.style.display==='block'?'none':'block'}setupBulk();const sk=localStorage.getItem('gestorSkin');if(sk!==null)setSkin(+sk);loadLocal();
</script></body></html>
